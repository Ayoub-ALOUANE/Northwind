services:
  warehouse:
    image: postgres:16
    container_name: postgres-warehouse

    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "55433:5432"

    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  warehouse_data:

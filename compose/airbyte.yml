services:
  airbyte-db:
    image: postgres:13
    container_name: airbyte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbyte
      POSTGRES_USER: airbyte
      POSTGRES_PASSWORD: airbyte_password
    volumes:
      - airbyte_db_data:/var/lib/postgresql/data
    networks:
      - data-platform

  airbyte-bootloader:
    image: airbyte/bootloader:0.50.36
    container_name: airbyte-bootloader
    environment:
      AIRBYTE_VERSION: 0.50.36
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: airbyte_password
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      DATABASE_HOST: airbyte-db
      DATABASE_PORT: 5432
      DATABASE_DB: airbyte
      CONFIG_DATABASE_USER: airbyte
      CONFIG_DATABASE_PASSWORD: airbyte_password
      CONFIG_DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      RUN_DATABASE_MIGRATION_ON_STARTUP: "true"
      LOG_LEVEL: INFO
    depends_on:
      - airbyte-db
    networks:
      - data-platform

  airbyte-temporal:
    image: airbyte/temporal:0.50.36
    container_name: airbyte-temporal
    restart: unless-stopped
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: airbyte
      POSTGRES_PWD: airbyte_password
      POSTGRES_SEEDS: airbyte-db
      LOG_LEVEL: INFO
    depends_on:
      - airbyte-db
    networks:
      - data-platform

  airbyte-server:
    image: airbyte/server:0.50.36
    container_name: airbyte-server
    restart: unless-stopped
    environment:
      AIRBYTE_VERSION: 0.50.36
      AIRBYTE_ROLE: server
      CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.50.33.008"
      JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.50.33.008"
      SECRET_PERSISTENCE: TESTING_CONFIG_DB_TABLE
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: airbyte_password
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      CONFIG_DATABASE_USER: airbyte
      CONFIG_DATABASE_PASSWORD: airbyte_password
      CONFIG_DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      TEMPORAL_HOST: airbyte-temporal:7233
      CONFIG_ROOT: /data
      WORKSPACE_ROOT: /workspace
      DATA_DOCKER_MOUNT: airbyte_data
      WORKSPACE_DOCKER_MOUNT: airbyte_workspace
      LOCAL_ROOT: /tmp/airbyte_local
      LOCAL_DOCKER_MOUNT: /tmp/airbyte_local
      TRACKING_STRATEGY: logging
      WEBAPP_URL: http://localhost:8000
      INTERNAL_API_HOST: airbyte-server:8001
      LOG_LEVEL: INFO
    volumes:
      - airbyte_workspace:/workspace
      - airbyte_data:/data
    ports:
      - "8001:8001"
    depends_on:
      - airbyte-bootloader
      - airbyte-temporal
    networks:
      - data-platform

  airbyte-worker:
    image: airbyte/worker:0.50.36
    container_name: airbyte-worker
    restart: unless-stopped
    environment:
      AIRBYTE_VERSION: 0.50.36
      AIRBYTE_ROLE: worker
      MICRONAUT_ENVIRONMENTS: control-plane
      CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.50.33.008"
      JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.50.33.008"
      SECRET_PERSISTENCE: TESTING_CONFIG_DB_TABLE
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: airbyte_password
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      CONFIG_DATABASE_USER: airbyte
      CONFIG_DATABASE_PASSWORD: airbyte_password
      CONFIG_DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      TEMPORAL_HOST: airbyte-temporal:7233
      CONFIG_ROOT: /data
      WORKSPACE_ROOT: /workspace
      DATA_DOCKER_MOUNT: airbyte_data
      WORKSPACE_DOCKER_MOUNT: airbyte_workspace
      LOCAL_ROOT: /tmp/airbyte_local
      LOCAL_DOCKER_MOUNT: /tmp/airbyte_local
      TRACKING_STRATEGY: logging
      WEBAPP_URL: http://localhost:8000
      INTERNAL_API_HOST: airbyte-server:8001
      DOCKER_NETWORK: northwind_data-platform
      LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - airbyte_workspace:/workspace
      - airbyte_data:/data
    depends_on:
      - airbyte-bootloader
      - airbyte-temporal
    networks:
      - data-platform

  airbyte-webapp:
    image: airbyte/webapp:0.50.36
    container_name: airbyte-webapp
    restart: unless-stopped
    environment:
      AIRBYTE_VERSION: 0.50.36
      AIRBYTE_ROLE: webapp
      INTERNAL_API_HOST: airbyte-server:8001
      CONNECTOR_BUILDER_API_HOST: airbyte-server:8001
      KEYCLOAK_INTERNAL_HOST: airbyte-server:8001
      TRACKING_STRATEGY: logging
    ports:
      - "8000:80"
    depends_on:
      - airbyte-server
    networks:
      - data-platform

  airbyte-cron:
    image: airbyte/cron:0.50.36
    container_name: airbyte-cron
    restart: unless-stopped
    environment:
      AIRBYTE_VERSION: 0.50.36
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: airbyte_password
      DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      CONFIG_DATABASE_USER: airbyte
      CONFIG_DATABASE_PASSWORD: airbyte_password
      CONFIG_DATABASE_URL: jdbc:postgresql://airbyte-db:5432/airbyte
      TEMPORAL_HOST: airbyte-temporal:7233
      LOG_LEVEL: INFO
    depends_on:
      - airbyte-bootloader
    networks:
      - data-platform

networks:
  data-platform:
    driver: bridge

volumes:
  airbyte_db_data:
    name: airbyte_db_data
  airbyte_workspace:
    name: airbyte_workspace
  airbyte_data:
    name: airbyte_data

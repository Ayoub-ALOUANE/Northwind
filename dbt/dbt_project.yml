name: 'northwind'
version: '1.0.0'
profile: 'northwind'

model-paths:     ["models"]
analysis-paths:  ["analyses"]
test-paths:      ["tests"]
seed-paths:      ["seeds"]
macro-paths:     ["macros"]
snapshot-paths:  ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  northwind:
    silver:
      +materialized: view

    gold:
      +schema: gold
      +materialized: table

snapshots:
  northwind:
    +target_schema: snapshots

seeds:
  northwind:
    +schema: seeds
    discount_tiers:
      +column_types:
        discount_min: float
        discount_max: float
        tier_order: integer
    country_region_mapping:
      +column_types:
        country: varchar(100)
        world_region: varchar(100)
        sub_region: varchar(100)

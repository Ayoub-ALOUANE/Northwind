version: 2

models:

  - name: bridge_employee_territories

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_id
              - territory_id

    columns:
      - name: employee_id
        tests:
          - not_null

      - name: territory_id
        tests:
          - not_null

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: dim_employees
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_shippers
    columns:
      - name: shipper_id
        tests:
          - unique
          - not_null

  - name: fact_sales

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id

    columns:

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: employee_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_employees')
                field: employee_id

      - name: shipper_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_shippers')
                field: shipper_id

      - name: order_date_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: required_date_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: shipped_date_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id